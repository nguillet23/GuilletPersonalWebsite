# Build and test every branch except main, and every PR into main, without deploying.
# Deploys only happen from main, in deploy.yml.
name: Build check

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

# Read-only: this workflow has no Pages permissions, so it cannot deploy.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Typecheck, lint, format check and tests.
      - run: npm run check
      - run: npm run build
